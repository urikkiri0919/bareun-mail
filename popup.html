<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>바른메일</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="header">
      <p class="eyebrow">MAIL WRITING ASSISTANT</p>
      <h1>바른메일</h1>
      <p class="description">보내기 전, 메일 표현을 차분하게 점검하세요.</p>
    </header>

    <p id="connection-status" class="status" role="status">
      AI API 연결 준비 중입니다. 연결 후 메일 초안을 보정할 수 있습니다.
    </p>

    <section class="draft-section" aria-labelledby="draft-label">
      <label id="draft-label" for="draft-input">메일 초안</label>
      <textarea
        id="draft-input"
        rows="7"
        placeholder="다듬을 메일 초안을 여기에 붙여넣으세요."
      ></textarea>
      <button id="correct-button" type="button" disabled>보정하기</button>
    </section>

    <section class="result-section" aria-labelledby="result-label">
      <h2 id="result-label">보정된 메일</h2>
      <div id="result-output" aria-live="polite"></div>
    </section>

    <p class="privacy-note">현재 버전은 입력한 메일을 저장하거나 전송하지 않습니다.</p>
  </main>
</body>
</html>
